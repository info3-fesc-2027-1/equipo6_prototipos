<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catarsis Barbería</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--card:#1c1917;--line:#2e2a27;--txt:#f5f1ea;--mut:#a39d94;--ac:#c5a059;--ac2:#8b5a2b;--mx:50%;--my:50%}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:Inter,sans-serif;transition:background .7s,--ac .7s;overflow-x:hidden}
h1,h2,h3,h4,.brand{font-family:Oswald,sans-serif;letter-spacing:.04em}
/* Resplandor que sigue al cursor */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(500px circle at var(--mx) var(--my),color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%);transition:background .3s}
section,header,footer{position:relative;z-index:1}
/* Navbar */
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(18,18,18,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);gap:16px}
.brand{font-size:1.4rem;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.brand i{color:var(--ac);transition:transform .6s}
.brand:hover i{transform:rotate(360deg)}
nav{display:flex;gap:28px}
nav a,.mag{color:var(--mut);text-decoration:none;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;padding:8px 2px;transition:.3s,opacity .3s,filter .3s;display:inline-block}
nav:hover a:not(:hover){opacity:.3;filter:blur(3px)}
nav a:hover{color:var(--ac)}

/* Zona derecha del header (Usuario + Reservar ahora) */
.header-right{display:flex;align-items:center;gap:12px}
.user-pill{
  display:none;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border-radius:99px;
  background:color-mix(in srgb,var(--ac) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);
  color:var(--txt);
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  animation:popIn .35s ease;
}
.user-pill.on{display:flex}
.user-pill i.fa-user-check{color:var(--ac)}
.user-pill .logout-mini{
  background:none;
  border:0;
  color:var(--mut);
  cursor:pointer;
  font-size:.85rem;
  padding:2px 4px;
  margin-left:2px;
  transition:color .2s;
}
.user-pill .logout-mini:hover{color:#e0524d}

.btn{background:var(--ac2);color:#fff;border:0;padding:12px 22px;border-radius:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-block;position:relative;overflow:hidden;transition:background .3s,box-shadow .3s}
.btn:hover{background:var(--ac);color:#111;box-shadow:0 8px 30px color-mix(in srgb,var(--ac) 40%,transparent)}
.btn.ghost{background:transparent;border:1px solid var(--ac);color:var(--ac)}
.btn.ghost:hover{background:var(--ac);color:#111}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
#pop{position:fixed;width:190px;height:125px;border-radius:14px;overflow:hidden;border:1px solid var(--line);pointer-events:none;opacity:0;transform:translate(-50%,-120%) scale(.85);transition:opacity .25s,transform .25s;z-index:60}
#pop.on{opacity:1;transform:translate(-50%,-120%) scale(1)}
#pop img{width:100%;height:100%;object-fit:cover}

/* ===== HERO CON DISEÑO GLASSMORPHISM CENTRADO ===== */
.hero{
  min-height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:48px 20px;
  background:
    linear-gradient(to bottom, rgba(14,14,16,.55), rgba(18,18,18,.92)),
    url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
}
.hero-brand-top{text-align:center;margin-bottom:22px}
.hero-brand-top h1{font-size:clamp(2.2rem,5vw,3.4rem);text-transform:uppercase;letter-spacing:.08em;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.hero-brand-top h1 span{display:inline-block;transition:transform .3s,color .3s}
.hero-brand-top h1 span:hover{transform:translateY(-8px) rotate(-4deg);color:var(--ac)}
.hero-brand-top p{color:#e5e0d8;font-size:.9rem;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.7)}

/* Tarjeta Glassmorphism */
.glass-card{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  padding:34px 32px 28px;
  box-shadow:0 25px 55px rgba(0,0,0,.55);
  position:relative;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .25s ease-out, border-color .4s, box-shadow .4s;
}
.glass-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(280px circle at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.22), transparent 70%);
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}
.glass-card:hover{
  border-color:var(--ac);
  box-shadow:0 30px 65px rgba(0,0,0,.65), 0 0 30px color-mix(in srgb,var(--ac) 25%,transparent);
}
.glass-card:hover::after{opacity:1}

.glass-card h2{
  text-align:center;
  font-size:1.55rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:4px;
}
.glass-card .sub{
  text-align:center;
  color:rgba(255,255,255,.82);
  font-size:.82rem;
  margin-bottom:20px;
}
.g-field{margin-bottom:15px}
.g-field label{
  display:block;
  font-size:.78rem;
  font-weight:600;
  color:#fff;
  margin-bottom:6px;
  letter-spacing:.03em;
}
.g-field input{
  width:100%;
  padding:11px 14px;
  background:rgba(232,235,239,.92);
  border:1px solid transparent;
  border-radius:6px;
  color:#1f2937;
  font:inherit;
  font-size:.9rem;
  outline:0;
  transition:background .25s, box-shadow .25s, border-color .25s;
}
.g-field input::placeholder{color:#6b7280}
.g-field input:focus{
  background:#fff;
  border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent);
}
.strength{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:6px;overflow:hidden}
.strength i{display:block;height:100%;width:0;transition:width .4s,background .4s}

.glass-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  gap:10px;
}
.btn-dark{
  background:#1f242d;
  color:#fff;
  border:0;
  padding:10px 22px;
  border-radius:6px;
  font-weight:600;
  font-size:.85rem;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:background .3s, color .3s, transform .2s;
  text-decoration:none;
  display:inline-block;
}
.btn-dark:hover{
  background:var(--ac);
  color:#111;
}
.glass-link{
  color:#fff;
  font-size:.78rem;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  opacity:.9;
  transition:color .2s, opacity .2s;
}
.glass-link:hover{color:var(--ac);opacity:1}

.glass-swap{
  text-align:center;
  font-size:.8rem;
  color:rgba(255,255,255,.85);
  margin-top:20px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.15);
}
.glass-swap a{
  color:#fff;
  font-weight:700;
  text-decoration:underline;
  cursor:pointer;
  transition:color .2s;
}
.glass-swap a:hover{color:var(--ac)}

/* ===== VISTA DE REGISTRO COMPLETADO ===== */
.reg-done{
  display:none;
  text-align:center;
  animation:popIn .4s ease;
}
.reg-done.on{display:block}
.done-badge{
  width:74px;
  height:74px;
  margin:0 auto 16px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:2rem;
  color:#111;
  background:var(--ac);
  box-shadow:0 0 30px color-mix(in srgb,var(--ac) 55%,transparent);
}
.done-info{
  background:rgba(18,18,18,.55);
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  padding:14px 16px;
  margin:16px 0 20px;
  text-align:left;
  font-size:.84rem;
}
.done-info div{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px dashed rgba(255,255,255,.12);
}
.done-info div:last-child{border-bottom:0}
.done-info span{color:rgba(255,255,255,.7)}
.done-info b{color:#fff}
.done-btns{display:flex;flex-direction:column;gap:10px}
.btn-logout-card{
  background:transparent;
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  padding:9px 16px;
  border-radius:6px;
  font-size:.8rem;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}
.btn-logout-card:hover{
  background:rgba(224,82,77,.2);
  border-color:#e0524d;
  color:#ffb4b2;
}

/* ===== PANELES GENERALES (AGENDAR / RESUMEN) ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px;transition:border-color .4s,transform .4s;transform-style:preserve-3d}
.panel:hover{border-color:var(--ac)}
.panel h2{font-size:1.6rem;margin-bottom:4px}
.panel .sub{color:var(--mut);font-size:.85rem;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px;transition:color .3s}
.field:focus-within label{color:var(--ac)}
.field input,.field select{width:100%;padding:11px 12px;background:#0d0c0b;border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:.9rem;outline:0;transition:border-color .3s,box-shadow .3s}
.field input:focus,.field select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Servicios */
.wrap{max-width:1150px;margin:auto;padding:70px 24px}
.title{text-align:center;margin-bottom:40px}
.title h2{font-size:clamp(2rem,5vw,3.2rem);text-transform:uppercase}
.title p{color:var(--mut);margin-top:8px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.tab{background:transparent;border:1px solid var(--
