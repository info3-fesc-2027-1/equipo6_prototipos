<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catarsis Barbería - Inicio de Sesión</title>
  
  <!-- Font Awesome para Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#121212',
              dark: '#1C1917',
              brown: '#8B5A2B',
              'brown-light': '#A06D3B',
              accent: '#C5A059',
              white: '#F9FAFB'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-black text-brand-white font-sans min-h-screen flex flex-col justify-between">

  <!-- Encabezado / Branding -->
  <header class="p-6 text-center border-b border-stone-800">
    <div class="inline-flex items-center space-x-3">
      <i class="fa-solid fa-scissors text-3xl text-brand-brown"></i>
      <h1 class="text-3xl font-extrabold tracking-widest text-brand-white uppercase">
        Catarsis
      </h1>
    </div>
    <p class="text-xs text-stone-400 mt-1 tracking-wider uppercase">Barbería & Grooming</p>
  </header>

  <!-- Contenido Principal: Formulario de Login -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-stone-900 border border-stone-800 rounded-2xl shadow-2xl p-8 my-8">
      
      <!-- Logo o Icono Central -->
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-brand-brown/10 border border-brand-brown rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fa-solid fa-user text-3xl text-brand-brown"></i>
        </div>
        <h2 class="text-2xl font-bold text-brand-white">Bienvenido</h2>
        <p class="text-sm text-stone-400 mt-1">Inicia sesión para reservar tu cita</p>
      </div>

      <!-- Mensaje de Error / Notificación -->
      <div id="error-message" class="hidden mb-4 p-3 bg-red-900/30 border border-red-800 text-red-300 text-sm rounded-lg text-center">
      </div>

      <!-- Formulario -->
      <form id="login-form" class="space-y-5">
        <div>
          <label for="email" class="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">
            Correo Electrónico
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-500">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="cliente@catarsis.com" 
              class="w-full pl-10 pr-4 py-3 bg-stone-950 border border-stone-800 rounded-lg text-brand-white placeholder-stone-600 focus:outline-none focus:border-brand-brown transition-colors"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••" 
              class="w-full pl-10 pr-10 py-3 bg-stone-950 border border-stone-800 rounded-lg text-brand-white placeholder-stone-600 focus:outline-none focus:border-brand-brown transition-colors"
            >
            <button 
              type="button" 
              id="toggle-password" 
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-stone-500 hover:text-stone-300"
            >
              <i class="fa-solid fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center text-stone-400 cursor-pointer">
            <input type="checkbox" id="remember" class="accent-brand-brown rounded bg-stone-950 border-stone-800 mr-2">
            Recordarme
          </label>
          <a href="#" id="forgot-password" class="text-brand-brown hover:text-brand-brown-light transition-colors">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 bg-brand-brown hover:bg-brand-brown-light text-brand-white font-bold rounded-lg shadow-lg hover:shadow-brand-brown/20 transition-all duration-200 uppercase tracking-wider text-sm mt-2"
        >
          Iniciar Sesión
        </button>
      </form>

      <!-- Divisor -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-stone-800"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-stone-900 px-3 text-stone-500">O entra como invitado</span>
        </div>
      </div>

      <!-- Enlace para registrarse o ingresar rápido -->
      <div class="text-center space-y-3">
        <button 
          type="button" 
          id="guest-login" 
          class="w-full py-2.5 bg-transparent border border-stone-700 hover:border-brand-brown text-stone-300 hover:text-brand-white rounded-lg text-sm transition-colors"
        >
          Ver Servicios sin iniciar sesión
        </button>

        <p class="text-xs text-stone-400 pt-2">
          ¿No tienes una cuenta? 
          <a href="#" id="register-link" class="text-brand-brown hover:text-brand-brown-light font-semibold">Registrate aquí</a>
        </p>
      </div>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="p-4 text-center text-xs text-stone-500 border-t border-stone-800">
    <p>&copy; 2026 Catarsis Barbería. Todos los derechos reservados.</p>
  </footer>

  <!-- Script JS externo -->
  <script src="script.js"></script>
</body>
</html>
